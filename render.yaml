services:
  - type: web
    name: hoku-healthcare-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: hoku-healthcare-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: NOTIFICATION_MODE
        value: log
      - key: ENABLE_SCHEDULER
        value: true

databases:
  - name: hoku-healthcare-db
    plan: free
    databaseName: hoku_healthcare
    user: hoku
